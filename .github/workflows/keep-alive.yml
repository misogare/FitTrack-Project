name: Keep-alive

# Prevents two free-tier gotchas from taking the deployed app down silently:
#   - Render's free web service spins down after ~15 min of no HTTP traffic
#   - Aiven's free MySQL plan auto-powers-off after a period with no connections
#     (this happened for real on 2026-08-30, ~1 day after the DB was created —
#     see docs/deployment/FitTrack-Deployment-Process.docx)
#
# A periodic hit to the login endpoint (which touches the database) keeps both
# alive. This is a workaround for free-tier limits, not a permanent fix — if
# the team moves to paid tiers later, this workflow can be removed.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl -sf https://fittrack-backend-0d90.onrender.com/api/health

      - name: Ping database via demo login (keeps Aiven from going idle)
        run: |
          curl -sf -X POST https://fittrack-backend-0d90.onrender.com/api/auth/login \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://fittrack-frontend-seven.vercel.app' \
            -d '{"email":"demo@fittrack.local","password":"Demo123!"}'
